name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So the site can be republished without a code change, and so the first
  # deploy can be triggered by hand once Pages is switched on.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The colour maths is the whole product, so a failing test blocks the
      # deploy rather than shipping a palette generator that is quietly wrong.
      - run: npm test

      - run: npm run build
        env:
          # Project page, served from /<repo>/. Derived from the repository
          # name so renaming or forking needs no edit here.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
